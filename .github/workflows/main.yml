name: Send SMS Batch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  send-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install gspread google-auth python-dotenv playwright
          playwright install --with-deps chromium

      - name: Run SMS sender
        env:
          RAISUGAR_EMAIL: ${{ secrets.RAISUGAR_EMAIL }}
          RAISUGAR_PASSWORD: ${{ secrets.RAISUGAR_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: python test.py
