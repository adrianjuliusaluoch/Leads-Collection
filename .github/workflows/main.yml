name: Send SMS Batch

on:
  schedule:
    - cron: '*/15 3-14 * * *'
  workflow_dispatch: {}

jobs:
  send-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install gspread google-auth python-dotenv playwright

      - name: Get installed Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pip show playwright | grep -i version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browser binary (only if cache missed)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install system dependencies (every run — fast, no download)
        run: playwright install-deps chromium

      - name: Run SMS sender
        env:
          RAISUGAR_EMAIL: ${{ secrets.RAISUGAR_EMAIL }}
          RAISUGAR_PASSWORD: ${{ secrets.RAISUGAR_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: python test.py
